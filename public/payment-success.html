<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment status | The Build Session</title><style>body{margin:0;background:#f3f3f4;color:#101010;font:16px/1.5 Arial,sans-serif;display:grid;min-height:100svh;place-items:center;padding:20px;box-sizing:border-box}.panel{background:#fff;border-radius:28px;padding:48px 28px;max-width:460px;width:100%;text-align:center;box-sizing:border-box}.brand{font-size:12px;font-weight:800;letter-spacing:.23em}.mark{width:70px;height:70px;background:#ccff00;border-radius:50%;display:grid;place-items:center;margin:35px auto 20px;font-size:35px;font-weight:700;animation:appear .7s cubic-bezier(.2,.8,.2,1) both}h1{font-size:clamp(29px,7vw,38px);line-height:1.05;letter-spacing:-.05em;margin:0 0 18px}p{color:#5b5b60;margin:0 0 14px}.ref{font-size:13px;color:#777;margin:20px 0 30px}a{color:inherit;font-weight:700;text-underline-offset:5px}@keyframes appear{from{opacity:0;transform:scale(.6) rotate(-20deg)}to{opacity:1;transform:scale(1) rotate(0)}}@media(prefers-reduced-motion:reduce){.mark{animation:none}}</style></head><body><main class="panel"><div class="brand">THE BUILD SESSION</div><div class="mark">✓</div><h1 id="title">Payment received.</h1><p id="message" role="status" aria-live="polite">We're confirming your payment now.</p><div class="ref">Reference: <strong id="ref"></strong></div><a href="/">Back to workshop</a></main><script>const ref=new URLSearchParams(location.search).get('ref')||'';document.getElementById('ref').textContent=ref;async function check(attempt=0){if(!ref)return;try{const r=await fetch('/api/payment-status?ref='+encodeURIComponent(ref),{cache:'no-store'});const j=await r.json();if(j.status==='confirmed'){document.getElementById('title').textContent='Your seat is confirmed.';document.getElementById('message').textContent='You’re in. Your confirmation email is on its way.';return}if(j.status==='support'){document.getElementById('title').textContent='Payment received.';document.getElementById('message').textContent='We’re reviewing your booking and will contact you shortly.';return}}catch(e){}if(attempt<10)setTimeout(()=>check(attempt+1),4000);else document.getElementById('message').textContent='Verification is taking longer than expected. Please check your inbox or contact us with your reference.'}check();</script></body></html>
